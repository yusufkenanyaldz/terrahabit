name: Nöral Alışkanlık APK

# NoralAliskanlik klasöründe değişiklik olunca (veya elle) debug APK derler.
on:
  push:
    paths:
      - 'NoralAliskanlik/**'
      - '.github/workflows/noral-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Alışkanlık mantığı testleri (ek paket gerekmez)
      - name: Testler
        run: node --test "NoralAliskanlik/tests/*.test.mjs"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # TerraHabit ile aynı imza anahtarı: her APK öncekinin üzerine kurulabilir.
      - name: İmza anahtarını hazırla
        if: env.KEYSTORE_B64 != ''
        run: |
          TEMIZ=$(printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ')
          # Bozuk / eksik yapıştırılmış secret için anlaşılır hata (değerin kendisi yazdırılmaz)
          if ! printf '%s' "$TEMIZ" | base64 --decode > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 bozuk: ${#TEMIZ} karakter geldi (Nöral Alışkanlık anahtarı 3508 karakter). Değeri ANDROID_KEYSTORE_BASE64.txt dosyasından 'Tümünü seç → Kopyala' ile yeniden yapıştırın."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Debug APK derle
        working-directory: NoralAliskanlik
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk "../NoralAliskanlik-${{ github.run_number }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NoralAliskanlik-${{ github.run_number }}-debug
          path: NoralAliskanlik-${{ github.run_number }}-debug.apk
